name: Contribution CI diagnostics

on:
  push:
    branches: [mattsgit/ci-diagnostics]

permissions:
  contents: read

jobs:
  reproduce:
    if: github.repository == 'mattsgit/OpenFUSIONToolkit'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        mode: [openmp, coverage]
    env:
      CC: gcc-12
      CXX: g++-12
      FC: gfortran-12
      GCOV: gcov-12
      OMP_NUM_THREADS: ${{ matrix.mode == 'openmp' && '2' || '1' }}
    steps:
      - uses: actions/checkout@v5
      - name: Prepare environment
        run: |
          lscpu
          python3 -m venv oft_venv
          echo 'source "${{ github.workspace }}/oft_venv/bin/activate"' > setup_env.sh
          source setup_env.sh
          python -m pip install pytest coverage numpy scipy h5py netcdf4 matplotlib
          mkdir -p builds diagnostic-results
      - name: Cache libraries
        uses: actions/cache@v5
        with:
          path: builds
          key: contribution-diagnostics-${{ matrix.mode }}-${{ hashFiles('src/utilities/build_libs.py') }}-dynamic-v1
      - name: Build libraries
        working-directory: builds
        run: |
          source ../setup_env.sh
          if [ '${{ matrix.mode }}' = coverage ]; then
            python ../src/utilities/build_libs.py --no_dl_progress --nthread=4 --oblas_dynamic_arch --build_mpich=1 --build_arpack=1 --build_petsc=1 --petsc_version=3.23 --petsc_openmp=1 --build_cmake=1 --oft_build_tests=1 --oft_build_coverage
          else
            python ../src/utilities/build_libs.py --no_dl_progress --nthread=4 --oblas_dynamic_arch --build_umfpack=1 --build_superlu=1 --build_arpack=1 --oft_build_tests=1
          fi
      - name: Configure and build
        working-directory: builds
        run: |
          source ../setup_env.sh
          bash config_cmake.sh
          cmake --build build_release -j 4
      - name: Baseline Taylor-Green repetitions
        if: matrix.mode == 'openmp'
        working-directory: builds/build_release/tests
        run: |
          source ../../../setup_env.sh
          python ../../../.github/workflows/repeat_taylor_green.py baseline
      - name: Test one ordered region per cell
        if: matrix.mode == 'openmp'
        run: |
          source setup_env.sh
          python .github/workflows/try_ordered_fix.py
          cmake --build builds/build_release -j 4
          cd builds/build_release/tests
          python ../../../.github/workflows/repeat_taylor_green.py ordered
          python -m pytest -q physics/test_taylor_green_2d.py physics/test_TokaMaker_mirnov.py
      - name: Run coverage regression suite with portable OpenBLAS
        if: matrix.mode == 'coverage'
        working-directory: builds/build_release
        run: |
          source ../../setup_env.sh
          make test
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: diagnostics-${{ matrix.mode }}
          path: |
            diagnostic-results
            builds/build/build_error.log
            builds/build_release/tests/OFT.junit.xml
            builds/build_release/tests/physics/taylor_green_2d.results
            builds/build_release/tests/physics/xmhd_2d.hist
            builds/build_release/tests/physics/core*
          if-no-files-found: ignore
